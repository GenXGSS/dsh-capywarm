<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CapyWarm 卡皮暖暖 icon">
  <!-- Original geometric capybara head, drawn for this plugin. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#F7EFE2"/>
  <!-- ears -->
  <circle cx="20" cy="16" r="5" fill="#8B5E3C"/>
  <circle cx="44" cy="16" r="5" fill="#8B5E3C"/>
  <!-- head: boxy capybara silhouette -->
  <rect x="10" y="14" width="44" height="38" rx="16" fill="#B08050"/>
  <!-- muzzle patch -->
  <ellipse cx="32" cy="42" rx="16" ry="11" fill="#C89A6B"/>
  <!-- closed content eyes -->
  <path d="M18 30 q4 4 8 0" stroke="#4A3220" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M38 30 q4 4 8 0" stroke="#4A3220" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- nose -->
  <ellipse cx="32" cy="40" rx="4.5" ry="3" fill="#4A3220"/>
  <!-- mouth -->
  <path d="M32 43 v2 M32 45 q-3 2 -5 0 M32 45 q3 2 5 0" stroke="#4A3220" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="16" cy="36" rx="3.5" ry="2.2" fill="#E8A08A" opacity="0.75"/>
  <ellipse cx="48" cy="36" rx="3.5" ry="2.2" fill="#E8A08A" opacity="0.75"/>
  <!-- warmth spark -->
  <path d="M52 8 l1.2 2.6 2.8 0.4 -2 2 0.5 2.8 -2.5 -1.3 -2.5 1.3 0.5 -2.8 -2 -2 2.8 -0.4 z" fill="#F2B33D"/>
</svg>
